name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests
        shell: bash
        run: |
          set -o pipefail
          make test 2>&1 | tee host-tests.log
      - name: Upload host test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-log
          path: host-tests.log

  nextui-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check integration script syntax
        run: python3 -m py_compile scripts/integrate_nextui.py
      - name: Check against current NextUI
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/LoveRetro/NextUI.git /tmp/NextUI
          python3 scripts/integrate_nextui.py /tmp/NextUI
          # It must be safe to run twice (important for iterative device builds).
          python3 scripts/integrate_nextui.py /tmp/NextUI
          git -C /tmp/NextUI diff --check
          grep -q 'minarch_local_link.c' /tmp/NextUI/workspace/all/minarch/makefile
          grep -q 'local_link_get_abi_version' /tmp/NextUI/workspace/all/minarch/ma_internal.h
          grep -q 'Add Instance' /tmp/NextUI/workspace/all/minarch/ma_frontend_opts.c
          grep -q 'LLMinarch_saveAndRemoveActive' /tmp/NextUI/workspace/all/minarch/ma_input.c
